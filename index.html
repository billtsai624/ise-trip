<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>伊勢自駕 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="伊勢自駕">
<meta name="theme-color" content="#F5F3EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout: phone-first single column, sticky header + bottom tab bar; deck's vermilion + cool gray carried over */
:root{
  --bg:#F5F3EF; --surface:#FFFFFF; --ink:#33312E; --muted:#6F6B65; --line:#E4E0D9;
  --accent:#B9573F; --accent-ink:#FFFFFF; --accent-soft:#F6E6E0;
  --good:#3F7A5C; --good-soft:#E3EFE7; --warn:#9A6A2C;
  --f-display:"Archivo","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Archivo",ui-monospace,system-ui,sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{flex:1;min-width:0}
.brand .eyebrow{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--accent)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:.01em}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--f-body);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
section.view{padding-block:18px 8px}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.25;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Hero summary */
.hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.hero div{padding:10px 8px 10px 0;min-width:0}
.hero div+div{padding-left:10px;border-left:1px solid var(--line)}
.hero b{display:block;font-size:15px;font-weight:500;line-height:1.4}

/* Day picker */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-btn{flex:0 0 auto;min-width:76px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 10px;text-align:left;cursor:pointer;font-family:var(--f-body)}
.day-btn .d{font-family:var(--f-num);font-weight:700;font-size:20px;line-height:1}
.day-btn .w{font-size:13px;color:var(--muted)}
.day-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day-btn[aria-pressed="true"] .w{color:var(--accent-ink);opacity:.85}
.day-btn .today{display:block;font-size:12px;font-weight:700}

.dayhead{display:flex;gap:14px;align-items:flex-end;margin:6px 0 10px}
.dayhead .big{font-family:var(--f-num);font-weight:700;font-size:46px;line-height:.9;letter-spacing:-.02em}
.dayhead .meta{min-width:0}
.dayhead .meta .k{font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--accent)}
.dayhead .meta .t{color:var(--muted);font-size:15px}
.daytitle{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.3;margin:0 0 10px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:15px;background:var(--surface);border:1px solid var(--line)}
.pill.car{background:var(--accent-soft);border-color:transparent;color:var(--ink)}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.timeline .tm{font-family:var(--f-num);font-weight:700;color:var(--accent);font-size:17px;padding-top:1px}
.timeline .tx{min-width:0}
.timeline .tx b{font-weight:500}
.timeline .tx small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.nav{font-size:14px;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:6px 12px;white-space:nowrap;align-self:center}

/* Tables */
.tbl{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:16px}
th{text-align:left;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 8px 8px 0;border-bottom:1px solid var(--muted)}
td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.d{font-family:var(--f-num);font-weight:700;color:var(--accent);white-space:nowrap}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:none;border-top:1px solid var(--muted)}
.note{font-size:14px;color:var(--muted);margin:-6px 0 18px}

.tips{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:0}
.tips li{display:grid;grid-template-columns:32px 1fr;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.tips .i{font-family:var(--f-num);font-weight:700;color:var(--accent)}
.spots{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-bottom:8px}
.spots div{border-top:1px solid var(--line);padding:10px 0;min-width:0}
.spots b{display:block;font-weight:700}
.spots span{font-size:15px;color:var(--muted)}

/* Booking cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card .row{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.card h3{margin:0;font-size:18px;font-weight:700}
.card .price{font-family:var(--f-num);font-weight:700;font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:12px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.code{font-family:var(--f-num);font-weight:700;letter-spacing:.04em}
.mini{font-size:14px;padding:7px 12px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}

/* Members */
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font:700 13px var(--f-num);color:#fff;flex:0 0 auto}
.crew{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.crew span{display:inline-flex;align-items:center;gap:6px;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px}
.crew .av{width:28px;height:28px;font-size:11px}

/* Ledger form */
form.add{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;margin-bottom:18px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:15px;color:var(--muted);font-weight:500}
input,select{font:17px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px 6px 6px;font:500 15px var(--f-body);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip .av{width:26px;height:26px;font-size:11px}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] .av{filter:grayscale(1)}
.chip.cat{padding:7px 14px}
.chip.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
.chip.cat[aria-pressed="false"]{opacity:1}
.formfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--accent)}
.status.ok{color:var(--good)}

.daygroup{margin-bottom:14px}
.daygroup h4{display:flex;justify-content:space-between;margin:0;padding:6px 0;border-bottom:1px solid var(--muted);font-size:15px}
.exp{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.exp .tx{min-width:0}
.exp .tx b{font-weight:500;display:block;overflow-wrap:anywhere}
.exp .tx small{color:var(--muted);font-size:14px}
.exp .amt{text-align:right}
.exp .amt .num{font-weight:700}
.exp .amt button{display:block;margin:4px 0 0 auto;border:none;background:none;color:var(--muted);font:14px var(--f-body);cursor:pointer;padding:4px 0}
.exp .amt button.sure{color:var(--accent);font-weight:700}
.empty{border:1px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;color:var(--muted);font-size:16px}

/* Settlement */
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:16px;flex-wrap:wrap}
.total .big{font-family:var(--f-num);font-weight:700;font-size:32px;line-height:1}
.bal{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.bal .bar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;position:relative;overflow:hidden}
.bal .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.bal .v{font-family:var(--f-num);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--accent)}
.xfer{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.xfer .who{display:flex;align-items:center;gap:6px;font-size:16px;min-width:0;flex-wrap:wrap}
.xfer .arrow{color:var(--muted)}
.xfer .m{text-align:right}
.xfer .m .num{font-weight:700;font-size:19px;display:block}
.xfer .m small{color:var(--muted);font-size:14px}
.rate{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted);margin:0 0 14px;flex-wrap:wrap}
.rate input{width:90px;padding:6px 8px;font-size:15px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:none;background:none;color:var(--muted);font:500 13px var(--f-body);padding:9px 0 10px;display:grid;justify-items:center;gap:3px;cursor:pointer;text-decoration:none}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

/* Install sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);color:var(--ink);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet ol{margin:6px 0 14px;padding-left:20px}
.sheet ol li{margin:4px 0}
.urlbox{display:flex;gap:8px;margin:8px 0 14px}
.urlbox input{font-size:13px}
@media (prefers-reduced-motion: no-preference){.view{animation:in .2s ease-out}@keyframes in{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (max-width:420px){.dayhead .big{font-size:40px}.timeline li{grid-template-columns:56px 1fr auto}.spots{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero div+div{padding-left:0;border-left:none;border-top:1px solid var(--line)}.timeline .nav{grid-column:2;justify-self:start}}

/* Info blocks: color = kind of information */
:root{
  --k-flight:#E4EDF7; --k-flight-line:#A9C0DB; --k-flight-ink:#2F5680;
  --k-car:#F8EEDB; --k-car-line:#E2C78F; --k-car-ink:#7A5617;
  --k-stay:#E3F0E6; --k-stay-line:#A9CDB2; --k-stay-ink:#2F6A43;
  --k-food:#F7E6E1; --k-food-line:#E1B3A6; --k-food-ink:#8A3F2C;
  --k-tip:#ECE8F5; --k-tip-line:#BDB3D9; --k-tip-ink:#4E4180;
}
.blocks{display:grid;gap:12px;margin:4px 0 18px}
.blk{border-radius:14px;padding:14px 16px;border:1px solid;min-width:0}
.blk.flight{background:var(--k-flight);border-color:var(--k-flight-line)}
.blk.car{background:var(--k-car);border-color:var(--k-car-line)}
.blk.stay{background:var(--k-stay);border-color:var(--k-stay-line)}
.blk.food{background:var(--k-food);border-color:var(--k-food-line)}
.blk.tip{background:var(--k-tip);border-color:var(--k-tip-line)}
.blk .tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:999px;background:var(--surface);margin-bottom:6px}
.blk.flight .tag{color:var(--k-flight-ink)} .blk.car .tag{color:var(--k-car-ink)} .blk.stay .tag{color:var(--k-stay-ink)} .blk.food .tag{color:var(--k-food-ink)} .blk.tip .tag{color:var(--k-tip-ink)}
.blk h3{margin:0 0 6px;font-size:18px;font-weight:700;line-height:1.4}
.blk dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 0;font-size:16px}
.blk dt{color:var(--muted);white-space:nowrap}
.blk dd{margin:0;min-width:0;overflow-wrap:anywhere}
.blk dd.code{font-family:var(--f-num);font-weight:700;font-size:18px;letter-spacing:.03em;color:var(--ink)}
.blk ul{margin:8px 0 0;padding-left:20px;font-size:16px}
.blk ul li{margin:3px 0}
.blk .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.blk .acts .btn{background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid}
.timeline{background:var(--surface);border:1px solid var(--line)!important;border-radius:14px;padding:0 16px!important}
.timeline li:last-child{border-bottom:none}
.sec-label{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:18px 0 8px}

/* Photos */
form.up{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;margin-bottom:18px}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);font-size:16px;cursor:pointer;text-align:center}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.previews{display:flex;gap:6px;flex-wrap:wrap}
.previews img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.pgroup{margin-bottom:18px}
.pgroup h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;min-width:0}
.ph a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35;overflow-wrap:anywhere}
.ph .cap b{color:var(--ink);font-weight:500}
.ph .del{border:none;background:none;color:var(--muted);font:13px var(--f-body);padding:2px 0;cursor:pointer}
.ph .del.sure{color:var(--accent);font-weight:700}
@media (max-width:420px){.pgrid{grid-template-columns:repeat(2,1fr)}}

/* Day map */
.mapwrap{position:relative;margin:0 0 14px}
#map{height:320px;border-radius:14px;border:1px solid var(--line);background:#E8E6E1;z-index:0}
.maptools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0 0;flex-wrap:wrap}
.maptools .note{margin:0}
.pin{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font:700 14px var(--f-num);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.home{background:#3F7A5C}
.me{width:18px;height:18px;border-radius:50%;background:#2F6FE0;border:3px solid #fff;box-shadow:0 0 0 2px rgba(47,111,224,.35),0 1px 4px rgba(0,0,0,.35)}
.leaflet-popup-content{font:15px/1.5 var(--f-body);margin:12px 14px}
.leaflet-popup-content b{display:block;font-size:16px}
.leaflet-popup-content .t{color:var(--accent);font:700 14px var(--f-num)}
.leaflet-popup-content small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.leaflet-popup-content a.go{display:inline-block;margin-top:8px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 12px;text-decoration:none;font-size:14px}
/* Spy game */
.game-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font:700 20px var(--f-num);color:var(--ink);cursor:pointer}
.stepper b{font:700 22px var(--f-num);min-width:24px;text-align:center}
.plist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font:500 16px var(--f-body);color:var(--ink);cursor:pointer;text-align:left;min-width:0}
.pbtn.done{opacity:.5}
.pbtn.out{opacity:.4;text-decoration:line-through}
.pbtn small{margin-left:auto;font-size:13px;color:var(--muted)}
.reveal{position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
.reveal .who{font-size:18px;opacity:.8}
.reveal .word{font:700 52px/1.2 var(--f-display);letter-spacing:.04em}
.reveal .hint{font-size:15px;opacity:.7}
.reveal .btn{font-size:17px;padding:12px 28px}
.order{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}

function computeSettle(){
  /* all math in TWD, displayed in the chosen currency */
  const paid={},owe={};NAMES.forEach(n=>{paid[n]=0;owe[n]=0});
  let total=0;
  for(const e of S.expenses){
    const sp=e.split.filter(n=>NAMES.includes(n));if(!sp.length||!NAMES.includes(e.payer))continue;
    const v=toBase(e.amount,e.cur);
    total+=v;paid[e.payer]+=v;sp.forEach(n=>owe[n]+=v/sp.length);
  }
  const net=NAMES.map(n=>({n,paid:paid[n],owe:owe[n],v:paid[n]-owe[n]}));
  const eps=0.5;
  const cred=net.filter(x=>x.v>eps).map(x=>({...x})).sort((a,b)=>b.v-a.v);
  const debt=net.filter(x=>x.v<-eps).map(x=>({...x,v:-x.v})).sort((a,b)=>b.v-a.v);
  const tx=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const m=Math.min(debt[i].v,cred[j].v);
    if(m>eps)tx.push({from:debt[i].n,to:cred[j].n,amt:m});
    debt[i].v-=m;cred[j].v-=m;if(debt[i].v<eps)i++;if(cred[j].v<eps)j++;
  }
  return {total,net,tx};
}

const API=(window.TRIP_CONFIG&&window.TRIP_CONFIG.API_URL||"").trim();
const MON={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};
function fixDay(d){d=String(d||"");if(/^\d{4}-\d{2}-\d{2}$/.test(d)||d==="pre")return d;
  const m=d.match(/([A-Z][a-z]{2}) (\d{1,2}) (\d{4})/);if(m&&MON[m[1]])return m[3]+"-"+MON[m[1]]+"-"+m[2].padStart(2,"0");
  const t=new Date(d);return isNaN(t)?d:new Date(t.getTime()+8*3600e3).toISOString().slice(0,10)}
function normalize(x){return {id:String(x.id||""),title:String(x.title||""),amount:+x.amount||0,payer:String(x.payer||""),split:Array.isArray(x.split)?x.split.map(String):String(x.split||"").split(",").filter(Boolean),day:fixDay(x.day),cat:String(x.cat||""),cur:CUR[x.cur]?String(x.cur):"JPY",createdAt:+x.createdAt||0}}
function applyItems(items){S.expenses=(items||[]).map(normalize).filter(e=>e.id);sortExp();S.dbState="live";rerenderKeepingForm()}
async function apiPost(body){
  /* text/plain avoids the CORS preflight Apps Script cannot answer */
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"failed");return j;
}

  if(!API||loading)return;loading=true;

  catch(e){if(S.dbState!=="live"||!navigator.onLine){S.dbState="slow";rerenderKeepingForm()}}
  finally{loading=false}
}
async function addExpense(item){
  if(S.dbState==="local"){item.id="l"+Date.now();S.expenses.push(item);sortExp();ls.set("ise.local",S.expenses);return true}
  try{const j=await apiPost({action:"add",item});applyItems(j.items);return true}
  catch(err){const m=document.getElementById("formMsg");if(m){m.textContent="沒有存成功，請檢查網路後再按一次";m.className="status err"}return false}
}
async function removeExpense(id){

  return `<section class="view">${head}<div class="game-card"><p class="result">${g.winner?esc(g.winner)+" 獲勝！":"遊戲結束"}</p></div>${board}<button class="btn primary" type="button" id="nhieAgain">開新的一局</button></section>`;
}

"誰最有可能把護照忘在飯店","誰最有可能在車上睡著","誰最有可能堅持再逛一間","誰最有可能點到最奇怪的菜","誰最有可能帶最多行李","誰最有可能第一個說好累",

"誰最有可能在抽籤抽到大吉","誰最有可能在夫婦岩許願","誰最有可能開車開到不想下車","誰最有可能半夜傳訊息聊天","誰最有可能把錢包放在最奇怪的地方","誰最有可能第一個起床"];
function viewMlt(){
  const g=S.mlt,me=ls.get("ise.me","Bill"),c=S.mltCfg;
  if(!g)return `<section class="view">${back()}<p class="status" style="margin-top:12px">載入中…</p></section>`;
  if(g.phase==="none"||g.phase==="end"&&S.mltNew)return `<section class="view">${back()}<h2 style="margin-top:10px">誰最有可能：開新局</h2>${meBar()}
    <div class="game-card"><div class="label" style="margin-bottom:8px">誰要玩（${c.players.length} 人）</div><div class="chips">${NAMES.map(n=>`<button type="button" class="chip" data-mp="${n}" aria-pressed="${c.players.includes(n)}">${av(n)}${n}</button>`).join("")}</div></div>
    <div class="game-card"><div class="label" style="margin-bottom:6px">玩法</div><ul style="margin:0;padding-left:20px;font-size:15px;line-height:1.7"><li>任何人出一題「誰最有可能……」，或按「給我一題」</li><li>每個人在自己手機投給最符合的人（可以投自己）</li><li>公布後，最高票的人得一分，看誰最後最「有可能」</li></ul></div>
    <p class="status" id="gMsg"></p><button class="btn primary" type="button" id="mltGo" style="width:100%;padding:14px;font-size:17px">開始</button></section>`;
  const head=`${back()}<h2 style="margin-top:10px">誰最有可能${g.phase!=="end"?`．第 ${g.round} 題`:""}</h2>${meBar()}<p class="status" id="gMsg"></p>`;
  const sc=g.players.slice().sort((a,b)=>(g.score[b]||0)-(g.score[a]||0));
  const board=`<div class="game-card"><div class="label" style="margin-bottom:8px">累計得票王</div><div class="lives">${sc.map(n=>`<div>${av(n)}${esc(n)}<span class="h" style="color:var(--ink);letter-spacing:0"><b class="num">${g.score[n]||0}</b> 次</span></div>`).join("")}</div></div>`;
  const ask=`<div class="game-card"><div class="label">出下一題</div><div class="field" style="margin-top:6px"><input id="mltQ" maxlength="60" placeholder="誰最有可能……" value="${esc(S.mltDraft)}"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" type="button" id="mltRand">給我一題</button><button class="btn primary" type="button" id="mltAsk">送出題目</button></div></div>`;
  if(g.phase==="pick")return `<section class="view">${head}${ask}${board}</section>`;
  if(g.phase==="vote"){const voted=Object.keys(g.votes||{});
    return `<section class="view">${head}<div class="game-card"><p class="bigq">${esc(g.prompt)}</p>
      ${g.players.includes(me)?`<div class="label" style="margin:10px 0 8px">我投給</div><div class="plist">${g.players.map(n=>`<button type="button" class="pbtn" data-mvote="${n}" ${g.votes[me]===n?'style="border-color:var(--accent);background:var(--accent-soft)"':""}>${av(n)}${n}${g.votes[me]===n?"<small>已投</small>":""}</button>`).join("")}</div>`:""}
      <div class="order" style="margin-top:12px">${g.players.map(n=>`<span style="${voted.includes(n)?"":"opacity:.45"}">${av(n)}${esc(n)}${voted.includes(n)?" ✓":""}</span>`).join("")}</div>
      <button class="btn primary" type="button" id="mltReveal" style="margin-top:12px">${voted.length<g.players.length?`公布（${voted.length}/${g.players.length} 人已投）`:"公布結果"}</button></div>${board}</section>`;}
  if(g.phase==="reveal"){const mx=Math.max(1,...Object.values(g.counts||{}));const order=g.players.slice().sort((a,b)=>((g.counts||{})[b]||0)-((g.counts||{})[a]||0));
    return `<section class="view">${head}<div class="game-card"><div class="label">${esc(g.prompt)}</div><p class="bigq">${g.top.length?g.top.map(esc).join("、")+(g.top.length>1?" 平手！":" 最有可能！"):"沒有人投票"}</p>
      <div class="tally">${order.map(n=>`<div>${av(n)}<span style="min-width:64px">${esc(n)}</span><span class="bar2"><i style="width:${((g.counts||{})[n]||0)/mx*100}%"></i></span><b class="num">${(g.counts||{})[n]||0}</b></div>`).join("")}</div></div>
      ${ask}${board}<button class="btn" type="button" id="mltEnd">結束遊戲</button></section>`;}
  return `<section class="view">${head}<div class="game-card"><p class="result">${sc.length&&(g.score[sc[0]]||0)?esc(sc[0])+" 是最有可能的人！":"遊戲結束"}</p></div>${board}<button class="btn primary" type="button" id="mltAgain">開新的一局</button></section>`;
}

/* ---------- Day map ---------- */
let MAP=null,meMarker=null,meCircle=null,lastPos=null,watchId=null;
function dayPoints(i){
  const pts=[];const seen=new Set();
  DAYS[i].stops.forEach(([tm,tx,sm,q])=>{const g=GEO[q];if(!g)return;const key=g.join(",");
    if(seen.has(key)){const p=pts.find(x=>x.key===key);p.items.push({tm,tx,sm});return}
    seen.add(key);pts.push({key,ll:g,q,items:[{tm,tx,sm}]})});
  return pts;
}
function initMap(){
  const el=document.getElementById("map");if(!el)return;
  if(typeof L==="undefined"){el.innerHTML='<p class="note" style="padding:16px">地圖需要網路才能顯示。</p>';return}
  if(MAP){MAP.remove();MAP=null;meMarker=null;meCircle=null}
  MAP=L.map(el,{zoomControl:true,attributionControl:true,tap:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(MAP);
  const pts=dayPoints(S.day);
  pts.forEach((p,n)=>{
    const home=/南伊勢町木谷|OMO|Kojan/.test(p.q);
    const icon=L.divIcon({className:"",html:`<div class="pin${home?" home":""}">${home?"⌂":n+1}</div>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-14]});
    const html=p.items.map(it=>`<span class="t">${esc(it.tm)}</span><b>${esc(it.tx)}</b>${it.sm?`<small>${esc(it.sm)}</small>`:""}`).join('<hr style="border:none;border-top:1px solid #ddd;margin:6px 0">')+`<a class="go" href="${gm(p.q)}" target="_blank" rel="noopener">Google 地圖導航</a>`;
    L.marker(p.ll,{icon}).addTo(MAP).bindPopup(html,{maxWidth:260});
  });
  if(pts.length>1)L.polyline(pts.map(p=>p.ll),{color:"#B9573F",weight:3,opacity:.55,dashArray:"6 8"}).addTo(MAP);
  if(pts.length)MAP.fitBounds(L.latLngBounds(pts.map(p=>p.ll)).pad(.15),{maxZoom:15});else MAP.setView([34.6,136.2],8);
  if(lastPos)drawMe(lastPos);
  startWatch();
}
function drawMe(pos){
  lastPos=pos;if(!MAP)return;
  const ll=[pos.coords.latitude,pos.coords.longitude];
  if(!meMarker){meMarker=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(MAP).bindPopup("<b>我在這裡</b>");
    meCircle=L.circle(ll,{radius:pos.coords.accuracy||30,color:"#2F6FE0",weight:1,fillOpacity:.1}).addTo(MAP)}
  else{meMarker.setLatLng(ll);meCircle.setLatLng(ll).setRadius(pos.coords.accuracy||30)}
}
function startWatch(){
  if(watchId!==null||!navigator.geolocation)return;
  watchId=navigator.geolocation.watchPosition(p=>{drawMe(p);const n=document.getElementById("geoNote");if(n)n.textContent="藍點是你現在的位置"},
    err=>{const n=document.getElementById("geoNote");if(n)n.textContent=err.code===1?"沒有開啟定位權限，看不到你的位置":"暫時抓不到你的位置";watchId=null},
    {enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
document.addEventListener("click",e=>{
  if(e.target.closest("#locBtn")){if(lastPos&&MAP){MAP.setView([lastPos.coords.latitude,lastPos.coords.longitude],15);meMarker&&meMarker.openPopup()}else{watchId=null;startWatch();const n=document.getElementById("geoNote");if(n)n.textContent="正在找你的位置…"}}
});

/* ---------- Photos ---------- */
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const M=1600,sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.82))};img.src=r.result};r.readAsDataURL(file)})}
function normPhoto(x){return {id:String(x.id||""),fileId:String(x.fileId||""),day:fixDay(x.day),by:String(x.by||""),caption:String(x.caption||""),createdAt:+x.createdAt||0}}
function applyPhotos(items){S.photos=(items||[]).map(normPhoto).filter(x=>x.id&&x.fileId).sort((a,b)=>(a.day||"").localeCompare(b.day||"")||a.createdAt-b.createdAt);S.photoState="live";if(S.view==="photos"&&!S.uploading){const ae=document.activeElement;if(!(ae&&ae.id==="pCap"))render()}}
let ploading=false;
async function refreshPhotos(){
  if(!API||ploading)return;ploading=true;
  try{const r=await fetch(API+(API.includes("?")?"&":"?")+"type=photos&t="+Date.now());const j=await r.json();if(!j.ok)throw 0;if(j.folderUrl)S.folderUrl=j.folderUrl;applyPhotos(j.photos)}
  catch(e){if(S.photoState!=="live"){S.photoState="slow";if(S.view==="photos")render()}}
  finally{ploading=false}
}
document.addEventListener("change",async e=>{
  if(e.target.id!=="fFiles")return;
  const fs=[...e.target.files].slice(0,10);S.files.forEach(f=>URL.revokeObjectURL(f.url));
  S.files=fs.map(f=>({file:f,url:URL.createObjectURL(f)}));
  const by=document.getElementById("pBy").value,day=document.getElementById("pDay").value,cap=document.getElementById("pCap").value;
  render();document.getElementById("pBy").value=by;document.getElementById("pDay").value=day;document.getElementById("pCap").value=cap;
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="upForm")return;e.preventDefault();
  const msg=document.getElementById("upMsg");
  if(!S.files.length){msg.textContent="請先選照片";msg.className="status err";return}
  const by=document.getElementById("pBy").value,day=document.getElementById("pDay").value,caption=document.getElementById("pCap").value.trim();
  ls.set("ise.me",by);S.uploading=true;
  const btn=e.target.querySelector("button[type=submit]");btn.disabled=true;
  let done=0,fail=0;
  for(const f of S.files){
    btn.textContent=`上傳中 ${done+fail+1}/${S.files.length}…`;
    try{const data=await shrink(f.file);const j=await apiPost({action:"photo",by,day,caption,data:data.split(",")[1],mime:"image/jpeg"});done++;S.photos=(j.photos||[]).map(normPhoto)}
    catch(err){fail++}
  }
  S.files.forEach(f=>URL.revokeObjectURL(f.url));S.files=[];S.uploading=false;
  await refreshPhotos();render();
  const m=document.getElementById("upMsg");m.textContent=fail?`上傳 ${done} 張，${fail} 張失敗，請再試一次`:`已上傳 ${done} 張`;m.className="status "+(fail?"err":"ok");
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-delphoto]");if(!t)return;
  const id=t.dataset.delphoto;
  if(S.pendingPhoto!==id){S.pendingPhoto=id;render();return}
  S.pendingPhoto=null;
  try{const j=await apiPost({action:"delphoto",id});applyPhotos(j.photos)}catch(err){render()}
});
